<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Buscador de CEP</title>
</head>
<body>
    <h1>Buscador de Endereço</h1>
    <button onclick="buscarCEP()">Buscar CEP 01001000</button>
    <p id="resultado"></p>
    <script>
        function buscarCEP() {
            fetch('https://viacep.com.br/ws/01001000/json/')
                .then(resposta => resposta.json()) // Transforma a resposta em texto legível
                .then(dados => {
                    // Coloca o resultado na tela
                    document.getElementById('resultado').innerText = "Rua: " + dados.logradouro;
                });
        }
    </script>
</body>
</html>
