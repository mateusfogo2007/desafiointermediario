<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Buscador de Endereços</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 0 auto; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #004494; }
        .resultado { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Busca de CEP</h2>
        <p>Digite um CEP abaixo para encontrar o endereço usando a API pública do ViaCEP.</p>
        
        <input type="text" id="cep" placeholder="Ex: 01001000 (Apenas números)" maxlength="8" />
        <button onclick="buscarCEP()">Buscar Endereço</button>

        <div id="resultadoBox" class="resultado" style="display: none;"></div>
    </div>
    <script>
        async function buscarCEP() {
            const cep = document.getElementById('cep').value;
            const resultadoBox = document.getElementById('resultadoBox');
            if (cep.length !== 8 || isNaN(cep)) {
                resultadoBox.style.display = "block";
                resultadoBox.innerHTML = "<p style='color:red;'>⚠️ Por favor, digite um CEP válido contendo 8 números.</p>";
                return;
            }
            resultadoBox.style.display = "block";
            resultadoBox.innerHTML = "<p>Buscando na API...</p>";
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                if (data.erro) {
                    resultadoBox.innerHTML = "<p style='color:red;'>❌ CEP não encontrado na base de dados.</p>";
                } else {
                    resultadoBox.innerHTML = `
                        <strong>Logradouro:</strong> ${data.logradouro} <br>
                        <strong>Bairro:</strong> ${data.bairro} <br>
                        <strong>Cidade/UF:</strong> ${data.localidade} - ${data.uf} <br>
                        <strong>DDD:</strong> ${data.ddd}
                    `;
                }
            } catch (error) {
                resultadoBox.innerHTML = "<p style='color:red;'>❌ Erro ao conectar com a API pública.</p>";
            }
        }
    </script>
</body>
</html>
